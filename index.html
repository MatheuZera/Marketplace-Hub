<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>MarketplaceHub v1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-mc-dark text-white min-h-screen flex flex-col">

    <!-- Header -->
    <header class="border-b border-mc-border bg-mc-card sticky top-0 z-40">
        <div class="max-w-[1400px] mx-auto px-4 md:px-6 h-[80px] flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-mc-green rounded-lg flex items-center justify-center font-black text-xl shadow-lg">M</div>
                <h1 class="text-xl font-black uppercase tracking-wider">Marketplace<span class="text-mc-green">Hub</span></h1>
            </div>
            
            <div class="flex items-center gap-4">
                <button onclick="openCreateModal()" class="bg-mc-green hover:bg-mc-green-hover text-white font-bold px-4 py-2.5 rounded-lg text-xs uppercase transition-colors cursor-pointer flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    Adicionar Item
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-[1400px] mx-auto px-4 md:px-6 py-8 flex-1 w-full">
        
        <!-- Barra de Pesquisa e Filtros -->
        <div class="flex flex-col md:flex-row gap-4 mb-8 justify-between items-center">
            <div id="category-filters" class="flex items-center gap-2 overflow-x-auto w-full pb-2 scrollbar-hide">
                <!-- Inserido dinamicamente pelo script.js -->
            </div>
            <div class="w-full md:w-[300px] relative">
                <input type="text" id="search-input" placeholder="Pesquisar itens ou criadores..." class="w-full bg-mc-card border border-mc-border rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-mc-green">
            </div>
        </div>

        <!-- Grid de Produtos -->
        <div id="marketplace-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
            <!-- Inserido dinamicamente pelo script.js -->
        </div>
    </main>

    <!-- Modal de Detalhes -->
    <div id="details-modal" class="fixed inset-0 bg-black/85 z-50 hidden items-center justify-center p-4 opacity-0 transition-opacity duration-300 backdrop-blur-sm">
        <div id="modal-content-box" class="bg-mc-card border border-mc-border rounded-xl max-w-5xl w-full max-h-[90vh] overflow-hidden flex flex-col md:flex-row relative transform scale-95 transition-transform duration-300">
            <!-- Preenchido via JavaScript -->
        </div>
    </div>

    <!-- Modal de Criação / Envio -->
    <div id="create-modal" class="fixed inset-0 bg-black/85 z-50 hidden items-center justify-center p-4 opacity-0 transition-opacity duration-300 backdrop-blur-sm">
        <div class="bg-mc-card border border-mc-border rounded-xl max-w-lg w-full p-6 relative">
            <h2 class="text-xl font-bold uppercase mb-4 text-white">Cadastrar Novo Item</h2>
            <form id="create-form" class="flex flex-col gap-4">
                <div>
                    <label class="block text-xs font-bold uppercase text-mc-muted mb-1">Título do Item</label>
                    <input type="text" id="item-title" required class="w-full bg-[#111] border border-mc-border rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-mc-green">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase text-mc-muted mb-1">Autor / Criador</label>
                        <input type="text" id="item-author" required class="w-full bg-[#111] border border-mc-border rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-mc-green">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-mc-muted mb-1">Categoria</label>
                        <select id="item-category" class="w-full bg-[#111] border border-mc-border rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-mc-green">
                            <option value="mundos">Mundos</option>
                            <option value="addons">Addons</option>
                            <option value="mods">Mods</option>
                            <option value="estruturas">Estruturas</option>
                            <option value="skins">Skins</option>
                            <option value="skin-packs">Skin-Packs</option>
                            <option value="servidores">Servidores</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase text-mc-muted mb-1">Tipo (Ex: Mapa, Pack)</label>
                        <input type="text" id="item-type" required class="w-full bg-[#111] border border-mc-border rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-mc-green">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-mc-muted mb-1">Preço (Ex: Grátis / 830)</label>
                        <input type="text" id="item-price" required class="w-full bg-[#111] border border-mc-border rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-mc-green">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase text-mc-muted mb-1">Avaliação (1 a 5)</label>
                        <input type="number" step="0.1" id="item-rating" value="5.0" class="w-full bg-[#111] border border-mc-border rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-mc-green">
                    </div>
                    <div class="flex items-center pt-6">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" id="item-is-coins" class="w-4 h-4 accent-mc-green">
                            <span class="text-xs font-bold uppercase text-mc-muted">Usa Moedas (Minecoins)?</span>
                        </label>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-mc-muted mb-1">Link da Imagem (URL Pública)</label>
                    <input type="url" id="item-image" required placeholder="https://..." class="w-full bg-[#111] border border-mc-border rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-mc-green">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-mc-muted mb-1">Descrição</label>
                    <textarea id="item-desc" rows="3" required class="w-full bg-[#111] border border-mc-border rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-mc-green resize-none"></textarea>
                </div>
                
                <div class="flex justify-end gap-3 mt-2">
                    <button type="button" onclick="closeCreateModal()" class="bg-[#222] hover:bg-[#333] text-white font-bold px-4 py-2 rounded-lg text-xs uppercase transition-colors cursor-pointer">Cancelar</button>
                    <button type="submit" id="submit-btn" class="bg-mc-green hover:bg-mc-green-hover text-white font-bold px-6 py-2 rounded-lg text-xs uppercase transition-colors cursor-pointer">Enviar para o GitHub</button>
                </div>
            </form>
            <button onclick="closeCreateModal()" class="absolute top-4 right-4 text-mc-muted hover:text-white"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-4 right-4 bg-mc-card border border-mc-border text-white px-6 py-3 rounded-lg shadow-2xl z-[100] transform translate-y-20 opacity-0 transition-all duration-300 flex items-center gap-3">
        <div class="w-2 h-2 rounded-full bg-mc-green"></div>
        <span id="toast-msg" class="text-xs font-bold uppercase">Ação realizada com sucesso!</span>
    </div>

    <!-- Scripts de Configuração e Lógica (Sem Firebase) -->
    <script src="marketplaceToken.js"></script>
    <script src="script.js"></script>
</body>
</html>
